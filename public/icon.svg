<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#blueGrad)"/>
  
  <!-- POS / Receipt / Cart Modern Graphic -->
  <g filter="url(#dropShadow)">
    <!-- Main Card/Receipt -->
    <rect x="136" y="110" width="240" height="292" rx="20" fill="#ffffff"/>
    
    <!-- Top Receipt Clip / Badge -->
    <rect x="206" y="86" width="100" height="36" rx="10" fill="#f59e0b"/>
    
    <!-- Receipt Lines -->
    <rect x="172" y="160" width="168" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="172" y="194" width="120" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="172" y="222" width="144" height="12" rx="6" fill="#e2e8f0"/>
    <line x1="172" y1="260" x2="340" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Cart / Sale Badge Accent -->
    <circle cx="256" cy="326" r="38" fill="#10b981"/>
    <path d="M242 326l10 10 20-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
